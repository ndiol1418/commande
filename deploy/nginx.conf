# Daaru Minam Cafe — site statique + API de commande
# Déposé par deploy/install.sh dans /etc/nginx/sites-available/daaruminam

server {
    listen 80;
    listen [::]:80;
    server_name daaruminamcafe.com www.daaruminamcafe.com;

    root /var/www/daaruminam;
    index index.html;

    client_max_body_size 1m;

    # en-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # l'API tourne en local, Nginx fait le relais
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # cache long pour les images, polices, sons
    location ~* \.(webp|jpg|jpeg|png|svg|woff2|mp3|webm)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # le CSS et le JS changent à chaque mise en ligne
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
